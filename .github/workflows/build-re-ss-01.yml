name: Build JDCloud RE-SS-01

"on":
  workflow_dispatch:
    inputs:
      variant:
        description: Firmware variant
        required: true
        default: istore
        type: choice
        options:
          - argon
          - istore

permissions:
  contents: write

env:
  SOURCE_REPOSITORY: https://github.com/LiBwrt/LibWrt.git
  SOURCE_BRANCH: 25.12-nss
  TZ: Asia/Taipei

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out builder configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve firmware variant
        id: variant
        run: bash .github/scripts/variant-metadata.sh "${{ inputs.variant }}" >> "$GITHUB_OUTPUT"

      - name: Reject existing product-version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.variant.outputs.tag }}
        run: |
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq '.[].ref')"
          if grep -Fxq "refs/tags/$RELEASE_TAG" <<< "$refs"; then
            echo "Product-version tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz genisoimage msmtp nano ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pip python3-pyelftools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone current LibWrt source
        id: source
        run: |
          git clone --depth 1 --single-branch \
            --branch "$SOURCE_BRANCH" "$SOURCE_REPOSITORY" openwrt
          cd openwrt
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Align RE-SS-01 factory image
        run: bash .github/scripts/fix-re-ss-01-factory.sh openwrt/target/linux/qualcommax/image/ipq60xx.mk

      - name: Restore downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: re-ss-01-${{ runner.os }}-${{ env.SOURCE_BRANCH }}-${{ steps.variant.outputs.variant }}-${{ steps.source.outputs.commit }}-${{ hashFiles(steps.variant.outputs.config_file) }}
          restore-keys: |
            re-ss-01-${{ runner.os }}-${{ env.SOURCE_BRANCH }}-${{ steps.variant.outputs.variant }}-

      - name: Add requested package feeds
        run: bash .github/scripts/add-package-feeds.sh openwrt/feeds.conf.default "${{ steps.variant.outputs.variant }}"

      - name: Install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -p mosdns -a
          if [[ "${{ steps.variant.outputs.variant }}" == "istore" ]]; then
            ./scripts/feeds install -d y -p istore luci-app-store
            ./scripts/feeds install -p nas quickstart
            ./scripts/feeds install -p nas_luci luci-app-quickstart
          fi
          ./scripts/feeds install -a

      - name: Install RE-SS-01 defaults
        run: cp -a files/. openwrt/files/

      - name: Load RE-SS-01 configuration
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/${{ steps.variant.outputs.config_file }}" .config
          make defconfig
          ./scripts/diffconfig.sh

      - name: Verify requested packages
        working-directory: openwrt
        run: |
          packages="$(bash "$GITHUB_WORKSPACE/.github/scripts/required-packages.sh" "${{ steps.variant.outputs.variant }}")"
          while IFS= read -r package; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config || {
              echo "Missing requested package: ${package}" >&2
              exit 1
            }
          done <<< "$packages"

      - name: Download source packages
        run: |
          make -C openwrt download -j"$(nproc)" || make -C openwrt download -j1 V=s
          find openwrt/dl -type f -size -1024c -print -delete

      - name: Compile firmware
        run: |
          make -C openwrt -j"$(nproc)" || make -C openwrt -j1 V=s

      - name: Prepare RE-SS-01 release
        run: |
          bash .github/scripts/prepare-release.sh openwrt/bin/targets/qualcommax/ipq60xx output \
            "${{ steps.variant.outputs.variant }}" "${{ steps.variant.outputs.version }}" \
            "${{ steps.source.outputs.commit }}" "${{ github.sha }}" "${{ steps.variant.outputs.config_file }}"

      - name: Verify RE-SS-01 release
        run: bash .github/scripts/verify-release.sh output "${{ steps.variant.outputs.variant }}" "${{ steps.variant.outputs.version }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.variant.outputs.artifact_name }}
          path: output/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ steps.variant.outputs.variant }}
          VERSION: ${{ steps.variant.outputs.version }}
          RELEASE_TAG: ${{ steps.variant.outputs.tag }}
          RELEASE_TITLE: ${{ steps.variant.outputs.release_title }}
          PRERELEASE: ${{ steps.variant.outputs.prerelease }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          BUILDER_COMMIT: ${{ github.sha }}
          SELECTED_CONFIG: ${{ steps.variant.outputs.config_file }}
        run: |
          release_flags=(--latest=true)
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          notes="$(printf '%s\n' \
            'Device: JDCloud AX1800 PRO (RE-SS-01)' \
            "Variant: $VARIANT" \
            "Product version: $VERSION" \
            "Source: LiBwrt/LibWrt $SOURCE_BRANCH ($SOURCE_COMMIT)" \
            "Builder commit: $BUILDER_COMMIT" \
            "Config: $SELECTED_CONFIG")"
          gh release create "$RELEASE_TAG" output/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BUILDER_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes "$notes" \
            "${release_flags[@]}"
